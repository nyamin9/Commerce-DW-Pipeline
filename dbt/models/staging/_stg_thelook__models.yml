version: 2

models:
  - name: stg_thelook__orders
    description: 주문 헤더. 원천과 1:1. 조인·집계 없음
    columns:
      - name: order_key
        description: >
          주문 대리키. order_id + user_id + created_at 로 만든다.
          원천이 재생성될 때 order_id 가 재사용되어 단독으로는 유일하지 않다
        data_tests: [unique, not_null]
      - name: order_id
        description: 원천 주문 식별자. **유일하지 않다** — 퇴화 차원으로 다룬다
        data_tests: [not_null]
      - name: user_id
        data_tests: [not_null]
      - name: order_status
        description: 소문자로 고정한 주문 상태
        data_tests:
          - accepted_values:
              values: ['cancelled', 'complete', 'processing', 'returned', 'shipped']
      - name: ordered_at
        data_tests: [not_null]
      - name: item_count
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"

  - name: stg_thelook__order_items
    description: 주문 상세. 매출 금액의 원천 입도
    columns:
      - name: order_item_key
        description: 주문 상세 대리키. order_item_id + order_id + created_at
        data_tests: [unique, not_null]
      - name: order_item_id
        description: 원천 상세 식별자. **유일하지 않다**
        data_tests: [not_null]
      - name: order_id
        description: >
          헤더 식별자. 여기서는 유일성도 참조 무결성도 보장되지 않는다.
          헤더와의 연결은 int_order_items_enriched 가 세대 정합 조인으로 맺고,
          그 결과인 order_key 에 relationships 테스트를 건다
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_thelook__products')
              field: product_id
      - name: order_item_status
        data_tests:
          - accepted_values:
              values: ['cancelled', 'complete', 'processing', 'returned', 'shipped']
      - name: sale_price
        description: NUMERIC 으로 고정한 판매가
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: stg_thelook__products
    description: 상품 마스터. 변경 이력은 snap_products 가 만든다
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: retail_price
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: unit_cost
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: department_name
        data_tests:
          - accepted_values:
              values: ['Men', 'Women']
      - name: distribution_center_id
        data_tests:
          - relationships:
              to: ref('stg_thelook__distribution_centers')
              field: distribution_center_id

  - name: stg_thelook__users
    description: >
      회원 마스터. street_address 와 좌표는 staging 에서 끊었다.
      email 은 여기까지만 살아 있고 dim_users 에서 해시로 대체된다
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: email
        description: "⚠️ PII. 마트로 그대로 내려보내지 않는다"
      - name: gender
        data_tests:
          - accepted_values:
              values: ['f', 'm']
      - name: acquisition_channel
        description: >
          ⚠️ users 와 events 는 채널 어휘가 다르다.
          users: display / email / facebook / organic / search
          events: adwords / email / facebook / organic / youtube
          같은 'traffic_source' 라는 이름을 쓰지만 값 집합이 겹치지 않는 부분이 있어
          두 테이블을 채널로 조인하면 조용히 어긋난다. 표준화가 필요한 지점이고,
          그 표준화는 마트가 아니라 이 계층 위에서 명시적으로 해야 한다.
        data_tests:
          - accepted_values:
              values: ['display', 'email', 'facebook', 'organic', 'search']
      - name: signed_up_at
        data_tests: [not_null]

  - name: stg_thelook__events
    description: 웹 행동 로그. 원천 세션 ID 는 source_session_id 로 이름을 구분해 둔다
    columns:
      - name: event_key
        description: 이벤트 대리키. event_id + session_id + created_at
        data_tests: [unique, not_null]
      - name: event_id
        description: 원천 이벤트 식별자. **유일하지 않다** (중복 42,787건)
        data_tests: [not_null]
      - name: user_id
        description: >
          비로그인 트래픽은 NULL 이다 (전체의 약 46%).
          not_null 을 걸지 않는 것이 맞고, 이 사실 자체를 문서에 남긴다
        data_tests:
          - relationships:
              to: ref('stg_thelook__users')
              field: user_id
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['cancel', 'cart', 'department', 'home', 'product', 'purchase']
      - name: traffic_source
        description: "⚠️ users.acquisition_channel 과 값 집합이 다르다. 그쪽 설명 참조"
        data_tests:
          - accepted_values:
              values: ['adwords', 'email', 'facebook', 'organic', 'youtube']
      - name: event_at
        data_tests: [not_null]
      - name: ip_address
        description: "⚠️ PII. fct_user_events 로 내리지 않는다"

  - name: stg_thelook__inventory_items
    description: 재고 단품. 원천의 비정규화된 상품 속성은 여기서 끊었다
    columns:
      - name: inventory_item_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_thelook__products')
              field: product_id

  - name: stg_thelook__distribution_centers
    description: 물류센터 마스터. 10행
    columns:
      - name: distribution_center_id
        data_tests: [unique, not_null]
      - name: distribution_center_name
        data_tests: [not_null]
