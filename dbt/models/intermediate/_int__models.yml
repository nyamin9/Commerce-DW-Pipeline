version: 2

models:
  - name: int_order_items_enriched
    description: >
      주문 상세 + 주문 헤더 + 상품 속성. 조인을 여기 한 번만 둔다.
      **성능이 아니라 정합성을 위한 계층이다** — 같은 조인이 mart 마다 복제되면
      나중에 한쪽만 고쳐져 매출 숫자가 갈라진다
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: order_key
        description: >
          세대 정합 조인으로 맺은 헤더 대리키. 세대가 맞는 헤더가 없으면 null 이다
          (약 1%). null 은 어느 주문에도 귀속시키지 않는다
      - name: order_item_id
        description: 원천 상세 식별자. **유일하지 않다**
        data_tests: [not_null]
      - name: gross_profit
        description: 매출 - 원가. 마진의 단일 정의
      - name: is_revenue_recognized
        description: 취소·반품 제외 기준. 이 판단이 여기 한 곳에만 있다
        data_tests: [not_null]

  - name: int_events_sessionized
    description: >
      행동 로그에 자체 세션 ID 부여. intermediate 중 유일하게 증분 테이블이다
      (view 로 두면 하류가 참조할 때마다 2.4M행 위의 윈도우 함수가 다시 돈다)
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: event_id
        description: 원천 이벤트 식별자. **유일하지 않다**
        data_tests: [not_null]
      - name: session_id
        data_tests: [not_null]
      - name: session_started_at
        data_tests: [not_null]
      - name: user_id
        data_tests: [not_null]

unit_tests:
  # ── generic / singular 과 성격이 다른 세 번째 축 ──────────────────────
  # 앞의 둘은 **데이터**를 검증한다. 이건 **변환 로직**을 검증한다.
  # 고정된 입력을 넣고 기대한 출력이 나오는지 본다. 원천 데이터가 필요 없어
  # 로직을 바꿀 때마다 즉시 돌릴 수 있다.
  #
  # 세션화는 이 프로젝트에서 로직이 가장 복잡한 곳이라 정확히 여기가 대상이다.
  - name: test_session_splits_on_inactivity_gap
    description: >
      무활동 30분(session_timeout_minutes)을 넘기면 새 세션으로 갈리고,
      넘지 않으면 같은 세션으로 묶이는지 검증한다
    model: int_events_sessionized
    # 증분 모델의 유닛 테스트는 증분 분기를 타지 않도록 고정한다
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_thelook__events')
        rows:
          # user 1 — 10:00 시작, 10:20 (20분, 유지), 11:00 (40분, 분리), 11:10 (10분, 유지)
          - {event_key: "k1", event_id: 1, user_id: 1, event_at: "2026-01-01 10:00:00", event_date: "2026-01-01", event_type: "home",     source_session_id: "s1", traffic_source: "organic", browser: "Chrome", uri: "/"}
          - {event_key: "k2", event_id: 2, user_id: 1, event_at: "2026-01-01 10:20:00", event_date: "2026-01-01", event_type: "product",  source_session_id: "s1", traffic_source: "organic", browser: "Chrome", uri: "/p/1"}
          - {event_key: "k3", event_id: 3, user_id: 1, event_at: "2026-01-01 11:00:00", event_date: "2026-01-01", event_type: "home",     source_session_id: "s2", traffic_source: "organic", browser: "Chrome", uri: "/"}
          - {event_key: "k4", event_id: 4, user_id: 1, event_at: "2026-01-01 11:10:00", event_date: "2026-01-01", event_type: "purchase", source_session_id: "s2", traffic_source: "organic", browser: "Chrome", uri: "/buy"}
          # user 2 — 다른 유저의 이벤트가 user 1 의 세션 경계에 영향을 주면 안 된다
          - {event_key: "k5", event_id: 5, user_id: 2, event_at: "2026-01-01 10:05:00", event_date: "2026-01-01", event_type: "home",     source_session_id: "s3", traffic_source: "email",   browser: "Safari", uri: "/"}
          # user_id 가 NULL 인 비로그인 트래픽은 제외되어야 한다
          - {event_key: "k6", event_id: 6, user_id: ~, event_at: "2026-01-01 10:06:00", event_date: "2026-01-01", event_type: "home",     source_session_id: "s4", traffic_source: "organic", browser: "Chrome", uri: "/"}
    expect:
      rows:
        - {event_key: "k1", event_id: 1, session_id: "1-20260101100000", is_session_start: 1}
        - {event_key: "k2", event_id: 2, session_id: "1-20260101100000", is_session_start: 0}
        - {event_key: "k3", event_id: 3, session_id: "1-20260101110000", is_session_start: 1}
        - {event_key: "k4", event_id: 4, session_id: "1-20260101110000", is_session_start: 0}
        - {event_key: "k5", event_id: 5, session_id: "2-20260101100500", is_session_start: 1}
