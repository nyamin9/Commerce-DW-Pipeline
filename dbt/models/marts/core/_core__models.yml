version: 2

models:
  # ────────────────────────────────────────────────────────────────────────
  # 표준 영역 (marts/core) — 도메인 사실을 재사용 가능한 형태로. 입도를 유지한다.
  # ────────────────────────────────────────────────────────────────────────

  - name: dim_users
    description: >
      회원 차원 (SCD Type 1, 현재 상태).
      PII 경계가 여기서 닫힌다 — 이름은 내리지 않고 email 은 해시와 도메인으로만 남는다
    # 계약을 강제한다. 컬럼이 빠지거나 타입이 바뀌면 **빌드가 실패한다.**
    # 스키마 드리프트를 staging 의 컬럼 명시로만 막으면 마트 쪽 변화는 못 잡는다.
    # 이 테이블은 하류 소비가 가장 넓어 조용한 변경의 피해가 가장 크다.
    config:
      contract:
        enforced: true
    columns:
      - name: user_id
        data_type: int64
        constraints: [{type: not_null}]
        data_tests: [unique]
      - name: email_hash
        data_type: string
        description: SHA-256(lower(trim(email))). 원문은 이 계층에 존재하지 않는다
      - name: email_domain
        data_type: string
      - name: age
        data_type: int64
      - name: age_group
        data_type: string
        data_tests:
          - accepted_values:
              values: ['10s', '20s', '30s', '40s', '50s', '60s+']
      - name: gender
        data_type: string
      - name: city
        data_type: string
      - name: state
        data_type: string
      - name: country
        data_type: string
      - name: postal_code
        data_type: string
      - name: acquisition_channel
        data_type: string
      - name: signed_up_at
        data_type: timestamp
      - name: signed_up_date
        data_type: date
      - name: signup_cohort_month
        data_type: date
        description: 가입월. 리텐션 분석의 코호트 정의를 여기 한 곳에 고정한다

  - name: dim_products
    description: 상품 차원 (SCD Type 1, 현재 상태). 이력은 dim_products_history
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: retail_price
        data_tests: [not_null]
      - name: distribution_center_id
        data_tests:
          - relationships:
              to: ref('dim_distribution_centers')
              field: distribution_center_id

  - name: dim_products_history
    description: >
      상품 차원의 SCD Type 2 표현. snapshot 이 만든 이력을 소비 가능한 형태로 정리한다.
      PK 는 product_id 가 아니라 product_history_key 다
    columns:
      - name: product_history_key
        description: 이력 행의 대리키 (dbt_scd_id)
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]

  - name: dim_distribution_centers
    description: 물류센터 차원. 10행
    columns:
      - name: distribution_center_id
        data_tests: [unique, not_null]

  - name: fct_orders
    description: 주문 헤더 팩트. 1행 = 주문 1건
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
      - name: net_revenue
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: fct_order_items
    description: >
      주문 상세 팩트. **매출의 기준 입도.**
      상품·부서별 매출은 이 테이블에서만 답할 수 있다
    config:
      contract:
        enforced: true
    columns:
      - name: order_item_id
        data_type: int64
        constraints: [{type: not_null}]
        data_tests: [unique]
      - name: order_id
        data_type: int64
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: user_id
        data_type: int64
        data_tests:
          - relationships:
              to: ref('dim_users')
              field: user_id
      - name: product_id
        data_type: int64
        data_tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: distribution_center_id
        data_type: int64
      - name: order_item_status
        data_type: string
        data_tests:
          - accepted_values:
              values: ['cancelled', 'complete', 'processing', 'returned', 'shipped']
      - name: order_status
        data_type: string
      - name: sale_price
        data_type: numeric
        constraints: [{type: not_null}]
      - name: unit_cost
        data_type: numeric
      - name: gross_profit
        data_type: numeric
      - name: discount_rate
        data_type: numeric
      - name: is_revenue_recognized
        data_type: bool
        constraints: [{type: not_null}]
      - name: net_revenue
        data_type: numeric
        description: 취소·반품을 0 으로 접은 매출. 이 기준이 여기 한 곳에만 있다
      - name: net_gross_profit
        data_type: numeric
      - name: ordered_at
        data_type: timestamp
        constraints: [{type: not_null}]
      - name: ordered_date
        data_type: date
        constraints: [{type: not_null}]
      - name: shipped_at
        data_type: timestamp
      - name: delivered_at
        data_type: timestamp
      - name: returned_at
        data_type: timestamp
      - name: days_to_ship
        data_type: int64
      - name: days_to_deliver
        data_type: int64

  - name: fct_user_events
    description: 유저 행동 팩트. 1행 = 이벤트 1건. 증분(insert_overwrite)
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: session_id
        data_tests: [not_null]
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['cancel', 'cart', 'department', 'home', 'product', 'purchase']
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id

  - name: fct_sessions
    description: 세션 팩트. 1행 = 세션 1건. fct_user_events 와 입도가 다르다
    columns:
      - name: session_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
      - name: session_duration_seconds
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: event_count
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"
