version: 2

models:
  # ────────────────────────────────────────────────────────────────────────
  # 소비 영역 (marts/reporting) — 특정 목적에 맞춰 반정규화·집계한다.
  # "주간 기준으로도 보고 싶다"는 요청이 오면 고칠 곳은 core 가 아니라 여기다.
  # ────────────────────────────────────────────────────────────────────────

  - name: rpt_daily_revenue
    description: >
      일자 × 부서 매출. daily → 누적(WTD/MTD/YTD) → 비교(YoY) 구조.
      모든 지표가 같은 모양을 갖게 해서 새 지표가 붙어도 소비자가 규칙을 다시 배우지 않게 한다
    columns:
      - name: ordered_date
        data_tests: [not_null]
      - name: department_name
        data_tests: [not_null]
      - name: net_revenue
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: net_revenue_mtd
        description: 월 누적. 매 실행마다 전체 재계산한다 — 규모가 커지면 증분 누적으로 바꿔야 한다
    data_tests:
      # 이 마트의 입도가 무엇인지 코드로 못 박는다.
      # 입도가 깨지면 대시보드에서 매출이 두 배로 보인다.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ordered_date, department_name]

  - name: rpt_user_cohort_retention
    description: 가입 코호트 × 경과 개월 구매 리텐션. AARRR 의 Retention
    columns:
      - name: retention_rate
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
      - name: months_since_signup
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [signup_cohort_month, activity_month]

  - name: rpt_daily_funnel
    description: >
      일자 × 유입채널 세션 퍼널. AARRR 의 Activation → Revenue.
      단계별 전환율과 전체 전환율을 **둘 다** 낸다 — 하나만 내면 반드시 각자 계산하기 시작한다
    columns:
      - name: session_count
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: cvr_session_to_purchase
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [session_date, entry_traffic_source]


# ──────────────────────────────────────────────────────────────────────────
# exposure — 리니지를 대시보드까지 잇는다
#
# dbt docs 의 기본 리니지는 **모델에서 끝난다.** 그 아래에 무엇이 붙어 있는지는
# 모른다. 그래서 "이 컬럼 지워도 되나요"라는 질문에 답할 수 없다.
#
# exposure 를 선언하면 그 답이 코드 안으로 들어온다.
#   dbt ls --select +exposure:executive_revenue_dashboard
#   → 이 대시보드가 의존하는 모든 모델과 원천이 나온다
#   dbt build --select rpt_daily_revenue+
#   → 이 모델을 바꿨을 때 영향받는 대시보드가 드러난다
#
# 스키마를 바꾸기 전에 downstream 영향도를 확인하는 절차가
# 사람의 기억이 아니라 명령 한 줄이 되는 것이 요점이다.
# ──────────────────────────────────────────────────────────────────────────

exposures:
  - name: executive_revenue_dashboard
    label: 경영진 매출 대시보드
    type: dashboard
    maturity: high
    description: >
      주간/월간 전략회의용. 부서별 매출과 누적 추이를 본다.
      maturity: high — 경영 보고에 쓰이므로 상류 변경 시 반드시 사전 공지가 필요하다
    depends_on:
      - ref('rpt_daily_revenue')
    owner:
      name: Analytics Engineering

  - name: growth_funnel_dashboard
    label: 그로스 퍼널 대시보드
    type: dashboard
    maturity: medium
    description: 유입채널별 세션 퍼널과 전환율. 캠페인 운영 중 일 단위로 확인한다
    depends_on:
      - ref('rpt_daily_funnel')
      - ref('rpt_user_cohort_retention')
    owner:
      name: Analytics Engineering

  - name: product_margin_analysis
    label: 상품 마진 분석
    type: analysis
    maturity: low
    description: >
      상품·카테고리별 마진 임시 분석. 표준 마트를 직접 조회한다.
      maturity: low — 애드혹이라 상류 변경 시 깨져도 영향 범위가 좁다
    depends_on:
      - ref('fct_order_items')
      - ref('dim_products')
    owner:
      name: Analytics Engineering
